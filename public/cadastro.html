<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf8ed">
  <title>Cadastro | Pokémon Trainer Hub</title>
  <link rel="stylesheet" href="/css/pokemon.css">
  <script src="/js/pokemon-app.js" defer></script>
</head>
<body data-page="cadastro">
  <header class="site-header" data-site-header></header>
  <main class="auth-shell">
    <div class="auth-layout">
      <section class="auth-copy">
        <p class="eyebrow">Novo treinador</p>
        <h1>Sua aventura começa agora.</h1>
        <p class="lead">Crie seu perfil, explore Alola e registre cada descoberta na sua Pokédex.</p>
      </section>
      <section class="form-card" aria-labelledby="signup-title">
        <h2 id="signup-title">Criar conta</h2>
        <p>Prepare-se para explorar todos os caminhos de Alola.</p>
        <form id="signup-form" class="form-grid">
          <label class="field field-full">
            <span>Nome do treinador</span>
            <input name="nome" type="text" minlength="2" maxlength="80" placeholder="Como devemos chamar você?" autocomplete="name" required>
          </label>
          <label class="field">
            <span>Nome de usuário</span>
            <input name="usuario" type="text" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="treinador_alola" autocomplete="username" required>
          </label>
          <label class="field">
            <span>E-mail</span>
            <input name="email" type="email" maxlength="254" placeholder="voce@email.com" autocomplete="email" required>
          </label>
          <label class="field">
            <span>Senha</span>
            <input name="senha" type="password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" placeholder="Letras e números" autocomplete="new-password" required>
          </label>
          <label class="field">
            <span>Confirmar senha</span>
            <input name="confirmacao" type="password" minlength="8" placeholder="Repita sua senha" autocomplete="new-password" required>
          </label>
          <p class="form-note field-full" id="signup-message" role="status" aria-live="polite"></p>
          <button class="btn field-full" type="submit">Criar conta de treinador</button>
        </form>
        <p class="form-foot">Já possui uma conta? <a href="/login.html">Entre aqui</a></p>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="footer-inner"><strong>Pokémon Trainer Hub</strong><span>Uma experiência independente inspirada na região de Alola.</span></div></footer>
</body>
</html>
